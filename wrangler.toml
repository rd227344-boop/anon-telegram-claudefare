[[d1_databases]]
binding = "DB"
database_name = "nexus-db"
database_id = "e5939fa4-9024-411d-b513-099e0cccc433"

[triggers]
crons = ["* * * * *"]

[vars]
ADMIN_IDS = "8858934619"
